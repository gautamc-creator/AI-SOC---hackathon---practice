# Publish the static VIGIL War Room to GitHub Pages on the free tier.
# The site is regenerated from the deterministic golden path in CI, so what is published
# is provably the output of `make demo` and not a hand-edited page.
name: Publish War Room

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependencies to install: the repository is standard-library only.
      - name: Regenerate artifacts and run the contract tests
        run: |
          make demo
          make test
      - name: Stage the static site
        run: make site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
